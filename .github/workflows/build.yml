name: Build GBA ROM

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile GBA ROM
        run: |
          docker run --rm -v "${{ github.workspace }}:/src" -w /src devkitpro/devkitarm bash -c '
            set -e
            export PATH="/opt/devkitpro/tools/bin:/opt/devkitpro/devkitARM/bin:$PATH"
            arm-none-eabi-gcc -mthumb -mthumb-interwork -mcpu=arm7tdmi -O2 main.c -specs=gba.specs -o chrome_dino.elf
            arm-none-eabi-objcopy -O binary chrome_dino.elf chrome_dino.gba
            gbafix chrome_dino.gba
          '

      - name: Upload GBA ROM
        uses: actions/upload-artifact@v4
        with:
          name: GD-GBA-ROM
          path: GD.gba
