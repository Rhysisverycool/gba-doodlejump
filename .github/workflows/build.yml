name: Build GBA ROM

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Compile with devkitARM
        run: |
          docker run --rm -v ${{ github.workspace }}:/src -w /src devkitpro/devkitarm make

      - name: Upload ROM
        uses: actions/upload-artifact@v4
        with:
          name: DoodleJump-GBA-ROM
          path: doodle_jump.gba
